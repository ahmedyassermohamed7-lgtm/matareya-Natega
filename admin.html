<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.1">
    <title>لوحة تحكم الأدمن</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f3f4f6; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 90vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            border: 2px solid #1e3a8a;
        }
        h2 { color: #1e3a8a; margin-top: 0; font-size: 24px;}
        label { display: block; margin-bottom: 10px; font-weight: bold; color: #374151; text-align: right;}
        
        /* تصميم خانة اختيار الوقت */
        input[type="datetime-local"] { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 25px; 
            border: 2px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 16px; 
            font-family: inherit; 
            box-sizing: border-box; 
            outline: none;
            direction: ltr; /* عشان التاريخ يظهر مظبوط */
        }
        input[type="datetime-local"]:focus { border-color: #2563eb; }

        /* تصميم الزراير الأساسية */
        button { 
            width: 100%; 
            background: #2563eb; 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 8px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-bottom: 10px;
        }
        button:hover { background: #1d4ed8; }
        
        .reset-btn { background: #ef4444; }
        .reset-btn:hover { background: #b91c1c; }
        
        .open-btn { background: #10b981; }
        .open-btn:hover { background: #059669; }

        /* 🌟 الألوان الجديدة للزراير الإضافية 🌟 */
        .lock-btn { background: #475569; } /* لون رمادي غامق مميز للقفل */
        .lock-btn:hover { background: #334155; }

        .go-btn { background: #4f46e5; } /* لون أزرق نيلي جذاب للانتقال للموقع */
        .go-btn:hover { background: #4338ca; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚙️ لوحة تحكم النتيجة</h2>
        
        <label>1. اختر موعد إعلان النتيجة:</label>
        <input type="datetime-local" id="timeInput">
        
        <button onclick="updateTime()">⏳ تشغيل العداد التنازلي</button>
        
        <hr style="border:0; border-top:1px solid #e5e7eb; margin: 20px 0;">
        
        <label>2. تغيير بيانات الدفعة والدور:</label>
        <input type="text" id="batchYearInput" placeholder="سنة الدفعة (مثال: 2026)" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; text-align: right;">
        <input type="text" id="batchMonthInput" placeholder="الدور (مثال: مايو أو سبتمبر)" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; text-align: right;">
        <button style="background: #8b5cf6; margin-bottom: 20px;" onclick="updateBatch()">💾 تحديث بيانات الدفعة</button>
        <hr style="border:0; border-top:1px solid #e5e7eb; margin: 20px 0;">
        
        <label>3. أوامر سريعة:</label>
        <button class="open-btn" onclick="openSite()">✅ فتح النتيجة فوراً</button>
        <button class="lock-btn" onclick="lockSite()">🔒 قفل الموقع بالكامل</button>
        <button class="reset-btn" onclick="resetTime()">🔄 مسح وقت الموبايل</button>
        <button class="go-btn" onclick="goToSite()">🌐 الذهاب للموقع</button>
    </div>

    <script>
        // رابط السيرفر بتاعك جاهز ومحفوظ هنا
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1-5vyXykMG8_UoZPqlVJ-W8AfBb01obrMMb5OPbmjY0lTGq7QHNqITtu2GEjNByjviQ/exec";
        const PASS = "123456";

        // دالة تشغيل العداد بالوقت اللي اختارته
        // الدالة المعدلة لإرسال التاريخ كنص طبيعي ومفهوم
        function updateTime() {
            const inputVal = document.getElementById('timeInput').value; // بيطلع كدة: 2026-06-01T15:30
            if (!inputVal) {
                alert("⚠️ الرجاء اختيار التاريخ والوقت أولاً!");
                return;
            }
            
            // تحويل حرف T لمسافة عشان التنسيق يبقى بسيط ومقروء للموقع الأساسي (2026-06-01 15:30)
            const formattedTime = inputVal.replace('T', ' ');
            
            // إرسال التاريخ بصيغته العادية النصية المشفرة لحمايته في الرابط
            const finalUrl = `${SCRIPT_URL}?action=admin&pass=${PASS}&state=waiting&time=${encodeURIComponent(formattedTime)}`;
            
            window.location.href = finalUrl;
        }

        // دالة فتح النتيجة فوراً بدون عداد
        function openSite() {
            if(confirm("هل أنت متأكد أنك تريد فتح النتيجة للجميع الآن؟")) {
                const finalUrl = `${SCRIPT_URL}?action=admin&pass=${PASS}&state=open`;
                window.location.href = finalUrl;
            }
        }

        // 🌟 دالة إغلاق الموقع بالكامل والتأكيد قبل التنفيذ 🌟
        function lockSite() {
            if(confirm("هل أنت متأكد أنك تريد إغلاق الموقع بالكامل أمام الطلاب؟")) {
                const finalUrl = `${SCRIPT_URL}?action=admin&pass=${PASS}&state=closed`;
                window.location.href = finalUrl;
            }
        }

        // دالة الـ Reset للرجوع لوقت الكمبيوتر
        function resetTime() {
            if(confirm("هل تريد مسح الوقت المحفوظ والرجوع لوقت الكود الأساسي؟")) {
                const finalUrl = `${SCRIPT_URL}?action=admin&pass=${PASS}&state=waiting&time=reset`;
                window.location.href = finalUrl;
            }
        }

        // 🌟 دالة الذهاب للموقع لفتح رابط الـ Netlify في تبويب جديد 🌟
        function goToSite() {
            window.open("https://ahmedyassermohamed7-lgtm.github.io/matareya-Natega/", "_blank");
        }

        // 🌟 الدالة الجديدة لإرسال الدفعة والشهر 🌟
        function updateBatch() {
            const year = document.getElementById('batchYearInput').value.trim();
            const month = document.getElementById('batchMonthInput').value.trim();
            
            if (!year || !month) {
                alert("⚠️ الرجاء كتابة السنة والدور أولاً في الخانات المخصصة!");
                return;
            }
            
            if(confirm("هل أنت متأكد أنك تريد تغيير عنوان الموقع إلى: دفعة " + year + " - دور " + month + "؟")) {
                const finalUrl = `${SCRIPT_URL}?action=admin&pass=${PASS}&state=updateBatch&year=${encodeURIComponent(year)}&month=${encodeURIComponent(month)}`;
                window.location.href = finalUrl;
            }
        }
    </script>
</body>
</html>
